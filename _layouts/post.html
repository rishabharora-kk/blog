---
layout: default
---
<article>

  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="dateline">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.updated %} &middot; updated {{ page.updated | date: "%B %-d, %Y" }}{% endif %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>

</article>

<script>
/* Let wide tables scroll on their own instead of breaking the page. */
document.querySelectorAll('.prose table').forEach(function (t) {
  if (t.parentElement.classList.contains('table-scroll')) return;
  var box = document.createElement('div');
  box.className = 'table-scroll';
  t.parentNode.insertBefore(box, t);
  box.appendChild(t);
});
</script>
